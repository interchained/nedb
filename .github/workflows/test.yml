name: test

# The gate that was missing.
#
# Until this file existed, the only workflows in this repo were `release` and
# `release-distros` — both triggered exclusively by `push: tags: v*`. The
# repository holds 21 Python suites and 5 Node suites, and none of them ran on
# a push or a pull request. Every merge to master was machine-unverified until
# somebody cut a tag, at which point the first automated opinion about the code
# arrived *after* it had already been published to PyPI, npm and crates.io.
#
# Tiers, cheapest first, so a typo fails in 40 seconds and not in 15 minutes:
#
#   python       10 dependency-free suites × 3 interpreters
#   rust         cargo test on the engine + cargo check on both binding crates
#   node         napi addon build, then smoke + durability + wrap family
#   python-native  maturin wheel, then the suites that need `nedb._native`
#   clients        the PUBLISHED PyPI + npm client packages, vs a live server
#   python-daemon  nedbd binary on PATH + the Postgres read endpoint via libpq
#
# Deliberately NOT a release gate: this runs the same suites the release
# workflow runs (and more), but on every push, so a red master is visible
# before a tag exists rather than after the artifacts are public.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------- python ---
  # The suites that need nothing but a stdlib interpreter. These are the fast
  # canary: if the pure-Python engine breaks, everything downstream is noise.
  python:
    name: python (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # test_crypto exercises encryption-at-rest, which is an OPTIONAL extra
      # (`pip install nedb-engine[encryption]`). The engine is right to make it
      # optional and the suite is right to test it; the runner just has to
      # actually have it. This is the one dependency the "dependency-free" tier
      # needs, and it stayed invisible for as long as the suites only ever ran
      # on machines that happened to have pycryptodome installed already.
      - name: Install optional extras the suites exercise
        # pycryptodome: encryption-at-rest (test_crypto).
        # fakeredis: lets test_wrap_redis run for real instead of self-skipping.
        #
        # pgserver + psycopg2: a REAL PostgreSQL server for the automatic
        # shadowing suite. `wrap_postgresql` is an audit layer FOR Postgres —
        # verifying it only against a mock is not verifying it. Without these
        # the suite self-skips its Postgres half, and a self-skipping test is
        # indistinguishable from a passing one, which is the whole failure
        # mode that suite exists to catch.
        run: pip install pycryptodome fakeredis pgserver psycopg2-binary
      - name: Run dependency-free suites
        env:
          PYTHONPATH: ${{ github.workspace }}/python
          # test_wrap_autoshadow must FAIL rather than skip if the real
          # PostgreSQL server is missing here — the extras above install it, so
          # a skip means the install broke, and a silent skip would report
          # green on an untested audit layer.
          NEDB_REQUIRE_PG: "1"
        run: |
          set -uo pipefail
          fail=0
          for t in test_nedb test_bitemporal test_causal test_concurrent \
                   test_crypto test_deploy test_proof test_v050 \
                   test_wrap_redis test_adapters test_wrap_sqlite_shadow \
                   test_wrap_autoshadow \
                   test_nql_predicates test_nql_shaping \
                   test_backcompat test_dag_preserved; do
            echo "::group::$t"
            if python3 "tests/$t.py"; then
              echo "PASS $t"
            else
              echo "::error title=$t::suite failed"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

  # ------------------------------------------------------------------ rust ---
  rust:
    name: rust (engine + bindings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: cargo test — engine library
        working-directory: rust
        run: cargo test -p nedb-engine --lib
      # The BINS were never compiled by any job. `cargo test --lib` builds the
      # library, the release workflow builds only `--bin nedbd`, and the
      # binding checks do not reach this crate's binaries — so `nedb-cli` sat
      # broken (a `use std::env;` glued onto a doc-comment line) with nothing to
      # notice. It also broke `cargo publish`, whose tarball verification
      # builds every target, which is why crates.io stalled at 3.1.0 while the
      # publish job reported success.
      #
      # --all-targets covers bins, examples, tests and benches in one pass.
      - name: cargo check — every target (bins included)
        working-directory: rust
        run: cargo check -p nedb-engine --all-targets
      # And RUN the integration tests, which were in the same blind spot: three
      # test targets (nedb_cli, v3_integration, cast_endpoint — 13 tests) that
      # nothing compiled, let alone executed. nedb_cli drives the compiled CLI
      # as a subprocess, so it needs the bin built, which --tests does.
      - name: cargo test — integration targets
        working-directory: rust
        run: cargo test -p nedb-engine --tests
      # The bindings are where drift hides: they are only ever compiled by the
      # release workflow, so a signature change in the core can sit broken on
      # master for days. `check` is cheap and catches exactly that.
      - name: cargo check — napi + pyo3 bindings
        working-directory: rust
        run: |
          cargo check -p nedb-node
          cargo check -p nedb-py

  # ------------------------------------------------------------------ node ---
  # Mirrors the release workflow's smoke gate, but on every push. Includes the
  # wrapper gate: index.js must stay the hand-written durable-mode wrapper and
  # never be overwritten by the generated napi loader. That regression shipped
  # silently once (fixed in 2.8.5) and is invisible to behavioural tests.
  node:
    name: node (addon + smoke + durability)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: npm install
      - name: Build native addon
        run: npx napi build --platform --release --cargo-cwd rust/crates/nedb-node --js native.js --dts native.d.ts
      - name: Wrapper gate — index.js must be the durable-mode wrapper
        run: |
          node -e "const {NedbCore}=require('./index.js');
                   if(!NedbCore.__exitFlushWrapped){
                     console.error('index.js is the generated loader, not the exit-flush wrapper');
                     process.exit(1)
                   }
                   console.log('wrapper present')"
      - name: Smoke — five acts
        run: node test/smoke.mjs | tee out.txt && grep -q "all five acts passed" out.txt
      - name: Durability — ticker keeps a SIGKILLed write
        run: node test/durability.test.mjs | tee dur.txt && grep -q "durability contract holds" dur.txt
      - name: Wrap adapter family (JS)
        run: node test/wrap_family.test.mjs
      - name: Inspector
        run: node test/inspector.test.mjs

  # --------------------------------------------------------- python-native ---
  # The suites that import `nedb._native`. Built with maturin exactly as the
  # release `wheels` job does, so a wheel that cannot be built is caught here
  # rather than mid-release.
  python-native:
    name: python (native extension)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Stage Python source + README into the maturin layout
        run: bash scripts/stage_maturin.sh
      - name: Build + install the native wheel
        run: |
          pip install --upgrade maturin
          maturin build --release --manifest-path rust/crates/nedb-py/Cargo.toml --out dist
          pip install --force-reinstall dist/*.whl
      # test_native is back in this list as of the ticker fix.
      #
      # It was dropped when this gate first ran, because it failed against a
      # real engine defect rather than a test bug: start_manifest_ticker held a
      # strong Arc<Db> in an unconditional loop, so the Db was never dropped,
      # the exclusive data-dir LOCK was never released, and reopening the same
      # path in the same process failed with "locked by another process (pid
      # N)" where N was the caller's own pid. The ticker now holds a Weak<Db>
      # and exits when the upgrade fails, so close/reopen works and this suite
      # is a real gate again.
      # test_nql_predicates appears in BOTH tiers on purpose. In the pure tier
      # it exercises the Python reference alone; here, with the maturin wheel
      # installed, it additionally runs every query through the Rust core and
      # asserts the two engines return IDENTICAL answers. That cross-engine leg
      # is the gate that was missing when the two NQL implementations drifted
      # apart on GROUP BY (required-vs-optional aggregate keyword, aggregating
      # the group field instead of the target field, and disagreeing output
      # keys) with nothing to catch it.
      #
      # It must NOT be run with PYTHONPATH=python here: the source tree has no
      # `_native` module, so putting it first pins __has_native__ to False and
      # the parity leg self-skips into a false green.
      - name: Run native-backed suites
        run: |
          set -uo pipefail
          fail=0
          for t in test_native test_celebration_v2 test_wrap_family \
                   test_nql_predicates test_nql_shaping \
                   test_backcompat test_dag_preserved; do
            echo "::group::$t"
            if python3 "tests/$t.py"; then echo "PASS $t"; else echo "::error title=$t::suite failed"; fail=1; fi
            echo "::endgroup::"
          done
          exit $fail

  # -------------------------------------------------------------- clients ---
  # The PUBLISHED client packages (`nedb-engine-client` on PyPI and npm).
  #
  # These ship on every `v*` tag and their only verification was "it imports"
  # (PyPI) and "it compiles" (npm). Not one request was ever made against a
  # server before publish — the same gap this workflow closed for the engine,
  # still open on the clients. Writing these suites found: `get()` could not
  # fetch any id containing a double quote (returned None for a document that
  # exists), `delete()` could not reach an id containing a slash, and the npm
  # client abandoned response bodies on its early-return paths.
  #
  # Both run against the PYTHON AOF server, so this tier needs no Rust build
  # and stays fast.
  clients:
    name: clients (published packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install httpx
      - name: PyPI client — nedb_client against a live nedbd
        run: python3 tests/test_client_package.py
      - name: npm client — build the artifact that actually ships
        run: |
          cd client/node
          npm install
          npx tsc
      - name: npm client — dist/index.js against a live nedbd
        # Imports dist/, not src/: the compiled output is what gets published,
        # so testing the source would not prove the artifact works.
        run: node client/node/test/client.test.mjs

  # --------------------------------------------------------- python-daemon ---
  # The suites that talk HTTP to nedbd. Each one auto-spawns the daemon when
  # nothing answers on :7070 and it can find a `nedbd` on PATH, so the job's
  # only real duty is to build the binary and put it there.
  python-daemon:
    name: python (nedbd HTTP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # httpx: the HTTP client every daemon suite uses.
      # fakeredis: test_celebration needs it and hard-fails without it, while
      # test_wrap_redis_nedbd skips cleanly on the same missing import. Install
      # it so the suite actually runs rather than papering over the difference.
      - run: pip install httpx fakeredis
      # `nedbd` is the PYTHON console script (nedb.server:main). It parses
      # --dag and then execs a RUST binary it looks up by the name `nedbd-v2`.
      # Installing the Rust binary as `nedbd` (the first version of this job)
      # replaced the console script entirely, so `nedbd --dag` reached the Rust
      # binary directly -- which has no --dag flag, exits with "unknown
      # option", and every daemon suite that self-spawns then times out.
      # Stage them the way a real `pip install nedb-engine` does.
      - name: Build nedbd-v2 and install the nedbd console script
        run: |
          cd rust
          cargo build --release --bin nedbd --package nedb-engine
          cd ..
          mkdir -p "$HOME/.local/bin"
          cp rust/target/release/nedbd "$HOME/.local/bin/nedbd-v2"
          chmod +x "$HOME/.local/bin/nedbd-v2"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pip install -e .
      - name: Confirm the daemon actually starts in --dag mode
        run: |
          command -v nedbd nedbd-v2
          nedbd-v2 --version
          # Both CLIs must answer --version. The console script did not until
          # 3.2.1 -- it exited 2 with "unrecognized arguments: --version" --
          # and nothing noticed, because nothing ever asked it.
          nedbd --version
          nedbd -V
          nedbd --dag --data "$RUNNER_TEMP/dagprobe" &
          for i in $(seq 1 20); do
            sleep 1
            if curl -sf -m 2 http://127.0.0.1:7070/health | tee /tmp/h.json | grep -q '"engine":"dag"'; then
              echo "daemon up in dag mode: $(cat /tmp/h.json)"; break
            fi
            [ "$i" -eq 20 ] && { echo "daemon never came up"; exit 1; }
          done
          pkill -x nedbd-v2 || true
      # The Postgres read endpoint, driven by a REAL libpq client.
      #
      # Unit tests prove the SQL→NQL translation and the message framing, but
      # only an actual PostgreSQL client proves the protocol: one wrong length
      # prefix desynchronises the stream and the client HANGS, which no unit
      # test would notice. psycopg2 is libpq, so if this passes then psql,
      # DBeaver, Metabase and Grafana can read a NEDB store too.
      - name: Postgres endpoint — simple protocol (psycopg2 / libpq)
        run: |
          pip install psycopg2-binary
          python3 tests/test_pgwire.py

      # pg_catalog / information_schema as REAL queryable tables. Driven over
      # the wire, because unit tests prove the rows exist and only a real
      # client proves they are reachable — and because the alternative
      # implementation (pattern-matching psql's query text) fails by returning
      # an EMPTY table list, which is indistinguishable from a database that
      # genuinely has no tables.
      - name: Postgres endpoint — pg_catalog / information_schema
        run: python3 tests/test_pgcatalog.py

      # psql's backslash commands, driven by the REAL psql binary.
      #
      # An assertion written against a query I typed proves only that I can
      # type the query I implemented. psql's actual SQL is the specification —
      # it changes between versions and is full of constructs nobody writes by
      # hand (OPERATOR(pg_catalog.~), COLLATE pg_catalog."C", E'\n'). So the
      # binary runs and its exit status is the verdict.
      #
      # NEDB_REQUIRE_PSQL=1: a missing psql FAILS here rather than skipping,
      # because a self-skipping test is indistinguishable from a passing one.
      - name: Postgres endpoint — psql \dn and \dt (real psql binary)
        env:
          NEDB_REQUIRE_PSQL: "1"
        run: |
          pip install pgserver
          python3 tests/test_psql_introspection.py

      # The EXTENDED query protocol, driven by the drivers that only speak it.
      #
      # psycopg2 interpolates parameters client-side, so the suite above only
      # ever exercises the simple protocol. psycopg3, asyncpg and JDBC send
      # Parse/Bind/Describe/Execute for every parameterised statement — before
      # that was implemented, none of them could run a single query. Both
      # drivers are installed here rather than skipped, because "it would work
      # if you had the driver" is not a test result.
      #
      # asyncpg is the strict one: it declares no parameter types, asks the
      # server, and REFUSES the call client-side if the answer is wrong. So this
      # tier also covers the schemaless type inference, which cannot be checked
      # from a unit test.
      - name: Postgres endpoint — extended protocol (psycopg3 + asyncpg)
        run: |
          pip install 'psycopg[binary]' asyncpg
          python3 tests/test_pgwire_extended.py

      - name: Run daemon-backed suites
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          set -uo pipefail
          nedbd --version || true
          fail=0
          for t in test_dag test_client test_tx test_celebration \
                   test_daemon_ttl test_wrap_redis_nedbd; do
            echo "::group::$t"
            if python3 "tests/$t.py"; then echo "PASS $t"; else echo "::error title=$t::suite failed"; fail=1; fi
            echo "::endgroup::"
          done
          exit $fail
